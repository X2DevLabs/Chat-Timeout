# Chat Timeout - example permissions. Copy what you need into your server.cfg
# (or a permissions.cfg you `exec`). Change the group names to match your own setup.

ensure chat
ensure chat-timeout

# ---------------------------------------------------------------
# 1. Give each role to a group
#    Roles from lowest to highest: Helper < Moderator < Admin < Owner
#    What each role can do (max time, permanent, lifting) is set in config.lua
# ---------------------------------------------------------------
add_ace group.helper    chattimeout.helper allow
add_ace group.moderator chattimeout.mod    allow
add_ace group.admin     chattimeout.admin  allow
add_ace group.owner     chattimeout.owner  allow

# ---------------------------------------------------------------
# 2. Optional: let higher groups inherit the lower ones.
#    You don't need this for the timeouts to work, because a player
#    always gets the HIGHEST role they have.
# ---------------------------------------------------------------
add_principal group.owner     group.admin
add_principal group.admin     group.moderator
add_principal group.moderator group.helper

# ---------------------------------------------------------------
# 3. Immunity: these players can't be timed out and skip the
#    spam check and word filter. Give it sparingly.
# ---------------------------------------------------------------
add_ace group.owner chattimeout.bypass allow

# ---------------------------------------------------------------
# 4. Put people in the groups. Use their Rockstar license.
# ---------------------------------------------------------------
add_principal identifier.license:0000000000000000000000000000000000000000 group.moderator
add_principal identifier.license:1111111111111111111111111111111111111111 group.admin
